          ref: "BEACH-DIG"
          eq: 0
      -
        id: "BEACH-DIG-STATE-1"
        match:
          ref: "BEACH-DIG"
          eq: 1
      -
        id: "BEACH-DIG-STATE-2"
        match:
          ref: "BEACH-DIG"
          eq: 2
      -
        id: "POST-SAND-FUNCTION-718C9EE8E654"
        match:
          all:
            -
              ref: "BEACH-DIG"
              eq: 3
            -
              ref: "SCARAB.INVISIBLE"
              eq: false
